<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botify - התחברות</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">Botify</div>
            <ul class="nav-links">
                <li><a href="index.html">בית</a></li>
            </ul>
        </nav>
    </header>

    <main style="max-width: 400px; margin: 3rem auto; padding: 2rem;" class="hero">
        <h2>התחברות למערכת</h2>
        <form id="loginForm" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem;">
            <div>
                <input type="text" id="username" placeholder="שם משתמש" required style="width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid #ccc;">
            </div>
            <div>
                <input type="password" id="password" placeholder="סיסמה" required style="width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid #ccc;">
            </div>
            <button type="submit" class="btn-primary">התחבר</button>
        </form>

        <div id="message" style="margin-top: 1rem; color: #d9534f;"></div>

        <p style="margin-top: 1.5rem; font-size: 0.9rem;">
            עדיין אין לך חשבון? <a href="register.html">להרשמה לחץ כאן</a>
        </p>
    </main>

    <script src="js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botify - התחברות</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .error-box {
            display: none;
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 14px;
            border: 1px solid #f5c6cb;
        }
        .btn-register {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            background-color: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-register:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>התחברות ל-Botify</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="קוד משתמש / שם משתמש" required>
            <input type="password" id="password" placeholder="סיסמה" required>
            <button type="submit">התחבר</button>
        </form>

        <div id="errorBox" class="error-box">
            <p id="errorMessage"></p>
            <a href="/register.html" class="btn-register">למעבר להרשמה</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');
            const errorMessage = document.getElementById('errorMessage');

            errorBox.style.display = 'none';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = data.redirectUrl;
                } else {
                    errorMessage.innerText = data.message;
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorMessage.innerText = 'שגיאה בתקשורת עם השרת';
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <script src="../js/session-manager.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botify - התחברות</title>
  <link rel="icon" type="image/png" href="../images/pic.png">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/login.css">
  <style>
    .login-wrapper {
      min-height: calc(100vh - 160px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      padding: 40px 35px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .login-card h2 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
      text-align: right;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(0, 4, 13, 0.12);
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 1.05rem;
      margin-top: 10px;
      margin-bottom: 20px;
    }
    .login-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.9rem;
      border-top: 1px solid #f1f5f9;
      padding-top: 18px;
    }
    .login-links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .back-home-link {
      color: #64748b !important;
      font-weight: 500 !important;
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.9rem;
      margin-bottom: 15px;
      display: none;
    }
    .forgot-password {
      display: block;
      margin: -8px 0 16px;
      color: #2563eb;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: left;
    }
    .reset-panel {
      margin: 18px 0;
      padding-top: 18px;
      border-top: 1px solid #f1f5f9;
    }
    .reset-panel h3 {
      margin: 0 0 8px;
      color: #0f172a;
    }
    .reset-panel p {
      margin: 0 0 14px;
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- סרגל ניווט עליון -->
  <header>
    <nav class="navbar">
      <a href="../index.html" class="logo" title="חזרה לדף הבית">
        <img src="../images/pic2.png" alt="Botify - בינה שמבינה" class="logo-img">
      </a>

      <ul class="nav-links">
        <li><a href="../index.html">בית</a></li>
        <li><a href="about.html">אודות</a></li>
        <li><a href="pricing.html">מחירון</a></li>
        <li><a href="contact.html">צור קשר</a></li>
      </ul>

      <div class="auth-buttons" id="nav-auth-container">
        <a href="register.html" class="btn-primary">הרשמה</a>
      </div>
    </nav>
  </header>

  <!-- כרטיס התחברות -->
  <main class="login-wrapper">
    <div class="login-card">
      <h2>התחברות ל-Botify</h2>

      <div id="login-error" class="error-msg" role="alert" aria-live="polite"></div>

      <form id="login-form">
        <div class="form-group" id="group-username">
          <input type="text" id="username" placeholder="שם משתמש / אימייל" aria-label="שם משתמש או אימייל" autocomplete="username" required>
        </div>

        <div class="form-group" id="group-password">
          <input type="password" id="password" placeholder="סיסמה" aria-label="סיסמה" autocomplete="current-password" required>
        </div>
        <a href="#password-reset" class="forgot-password" id="forgot-password-link">שכחת סיסמה?</a>

        <!-- שדה קוד אימות שיופיע אוטומטית בשלב השני -->
        <div class="form-group" id="group-otp" style="display: none;">
          <input type="text" id="otpCode" placeholder="הכנס קוד אימות בן 6 ספרות" aria-label="קוד אימות בן 6 ספרות" inputmode="numeric" maxlength="6" disabled required style="text-align: center; font-size: 18px; letter-spacing: 4px;">
        </div>

        <button type="submit" class="btn-primary btn-submit" id="btn-login">התחבר</button>
      </form>

      <form id="password-reset-form" class="reset-panel" style="display: none;" novalidate>
        <h3>יצירת סיסמה חדשה</h3>
        <p id="reset-description">אם שם המשתמש קיים, יישלח קוד לכתובת האימייל המשויכת לחשבון.</p>
        <div class="form-group" id="reset-username-group">
          <input type="text" id="reset-username" placeholder="שם משתמש" aria-label="שם משתמש לאיפוס סיסמה" autocomplete="username">
        </div>
        <div id="reset-confirmation-fields" style="display: none;">
          <div class="form-group">
            <input type="text" id="reset-code" placeholder="קוד אימות בן 6 ספרות" aria-label="קוד איפוס סיסמה" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
          </div>
          <div class="form-group">
            <input type="password" id="new-password" placeholder="סיסמה חדשה" aria-label="סיסמה חדשה" minlength="8" maxlength="128" autocomplete="new-password">
          </div>
          <div class="form-group">
            <input type="password" id="confirm-password" placeholder="אימות סיסמה חדשה" aria-label="אימות סיסמה חדשה" minlength="8" maxlength="128" autocomplete="new-password">
          </div>
        </div>
        <button type="submit" class="btn-primary btn-submit" id="reset-submit">שליחת קוד</button>
      </form>

      <div class="login-links">
        <span>עדיין אין לך חשבון? <a href="register.html" id="register-link">הרשמה מהירה</a></span>
        <a href="../index.html" class="back-home-link">➔ חזרה לדף הבית</a>
      </div>
    </div>
  </main>

  <!-- פוטר -->
  <footer>
    <p>&copy; 2026 Botify. כל הזכויות שמורות.</p>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../services/api-service.js"></script>
  <script type="module" src="../js/login.js"></script>
  <script src="../js/navbar-auth.js"></script>
</body>
</html>

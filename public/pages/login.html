<!DOCTYPE html>

  <!-- תג meta מספק הגדרות מסמך לדפדפן; charset מגדיר קידוד תווים ו־viewport תומך בפריסה מותאמת למסכים שונים. --><meta charset="UTF-8">
  <!-- תג meta מספק הגדרות מסמך לדפדפן; charset מגדיר קידוד תווים ו־viewport תומך בפריסה מותאמת למסכים שונים. שם השדה הוא viewport. --><meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- הקישור למשאב ../images/pic.png מחבר עיצוב, סמל אתר או משאב מסמך לפי rel. הסוג הוא image/png; כתובת היעד הוא ../images/pic.png. --><link rel="icon" type="image/png" href="../images/pic.png">
  <!-- הקישור למשאב ../css/global.css מחבר עיצוב, סמל אתר או משאב מסמך לפי rel. כתובת היעד הוא ../css/global.css. --><link rel="stylesheet" href="../css/global.css">
  <!-- הקישור למשאב ../css/login.css מחבר עיצוב, סמל אתר או משאב מסמך לפי rel. כתובת היעד הוא ../css/login.css. --><link rel="stylesheet" href="../css/login.css">
  <!-- תג style מכיל כללי CSS לעיצוב הדף; הוא נפרד מתוכן ה־HTML ואין להוסיף בו הערות HTML. --><style>
    .login-wrapper {
      min-height: calc(100vh - 160px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      padding: 40px 35px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

      font-size: 1.8rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
      text-align: right;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;

    }

      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(0, 4, 13, 0.12);
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 1.05rem;
      margin-top: 10px;
      margin-bottom: 20px;
    }
    .login-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.9rem;
      border-top: 1px solid #f1f5f9;
      padding-top: 18px;
    }
    .login-links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .back-home-link {
      color: #64748b !important;
      font-weight: 500 !important;
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.9rem;
      margin-bottom: 15px;
      display: none;
    }
    .forgot-password {
      display: block;
      margin: -8px 0 16px;
      color: #2563eb;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: left;
    }
    .reset-panel {
      margin: 18px 0;
      padding-top: 18px;
      border-top: 1px solid #f1f5f9;
    }

      margin: 0 0 8px;
      color: #0f172a;

    .reset-panel p {

      color: #64748b;
      font-size: 0.9rem;

</head>
<!-- האזור body מכיל את התוכן והפקדים שמוצגים למשתמש בדף. --><body>

      <!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. מחלקות העיצוב הוא logo; כתובת היעד הוא ../index.html. --><a href="../index.html" class="logo" title="חזרה לדף הבית">
        <!-- התמונה img מציגה קובץ שמוגדר ב־src; alt מספק תיאור חלופי לקוראי מסך או כשהתמונה אינה נטענת. מחלקות העיצוב הוא logo-img; מקור הקובץ הוא ../images/pic2.png. --><img src="../images/pic2.png" alt="Botify - בינה שמבינה" class="logo-img">
      </a>

      <!-- הרשימה ul מציגה פריטים ללא סדר מחייב. מחלקות העיצוב הוא nav-links. --><ul class="nav-links">

        <!-- הפריט li הוא פריט יחיד בתוך רשימה. --><li><!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. כתובת היעד הוא about.html. --><a href="about.html">אודות</a></li>
        <!-- הפריט li הוא פריט יחיד בתוך רשימה. --><li><!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. כתובת היעד הוא pricing.html. --><a href="pricing.html">מחירון</a></li>
        <!-- הפריט li הוא פריט יחיד בתוך רשימה. --><li><!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. כתובת היעד הוא contact.html. --><a href="contact.html">צור קשר</a></li>
      </ul>

        <!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. מחלקות העיצוב הוא btn-primary; כתובת היעד הוא register.html. --><a href="register.html" class="btn-primary">הרשמה</a>

    <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. מחלקות העיצוב הוא login-card. --><div class="login-card">

      <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. המזהה הוא login-error; מחלקות העיצוב הוא error-msg; התפקיד הסמנטי הוא alert. --><div id="login-error" class="error-msg" role="alert" aria-live="polite"></div>

      <!-- הטופס form מאגד שדות ופקדי שליחה. action ו־method, אם קיימים, מגדירים יעד ואופן שליחה; לעיתים JavaScript מטפל בשליחה. המזהה הוא login-form. --><form id="login-form">
        <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. המזהה הוא group-username; מחלקות העיצוב הוא form-group. --><div class="form-group" id="group-username">
          <!-- השדה input אוסף ערך מהמשתמש; type קובע סוג שדה, name/id מזהים אותו, ו־required/placeholder עשויים להגדיר חובה או רמז. המזהה הוא username; הסוג הוא text; תווית נגישה הוא שם משתמש או אימייל. --><input type="text" id="username" placeholder="שם משתמש / אימייל" aria-label="שם משתמש או אימייל" autocomplete="username" required>
        </div>

        <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. המזהה הוא group-password; מחלקות העיצוב הוא form-group. --><div class="form-group" id="group-password">
          <!-- השדה input אוסף ערך מהמשתמש; type קובע סוג שדה, name/id מזהים אותו, ו־required/placeholder עשויים להגדיר חובה או רמז. המזהה הוא password; הסוג הוא password; תווית נגישה הוא סיסמה. --><input type="password" id="password" placeholder="סיסמה" aria-label="סיסמה" autocomplete="current-password" required>
        </div>
        <!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. המזהה הוא forgot-password-link; מחלקות העיצוב הוא forgot-password; כתובת היעד הוא #password-reset. --><a href="#password-reset" class="forgot-password" id="forgot-password-link">שכחת סיסמה?</a>

        <!-- שדה קוד אימות שיופיע אוטומטית בשלב השני -->
        <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. המזהה הוא group-otp; מחלקות העיצוב הוא form-group. --><div class="form-group" id="group-otp" style="display: none;">

        </div>

        <!-- הכפתור button מפעיל פעולה או שולח טופס; type, id ו־class עשויים לקבוע את אופן הפעולה והעיצוב. המזהה הוא btn-login; מחלקות העיצוב הוא btn-primary btn-submit; הסוג הוא submit. --><button type="submit" class="btn-primary btn-submit" id="btn-login">התחבר</button>
      </form>

      <!-- הטופס form מאגד שדות ופקדי שליחה. action ו־method, אם קיימים, מגדירים יעד ואופן שליחה; לעיתים JavaScript מטפל בשליחה. המזהה הוא password-reset-form; מחלקות העיצוב הוא reset-panel. --><form id="password-reset-form" class="reset-panel" style="display: none;" novalidate>

        <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. המזהה הוא reset-username-group; מחלקות העיצוב הוא form-group. --><div class="form-group" id="reset-username-group">

        </div>
        <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. המזהה הוא reset-confirmation-fields. --><div id="reset-confirmation-fields" style="display: none;">
          <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. מחלקות העיצוב הוא form-group. --><div class="form-group">
            <!-- השדה input אוסף ערך מהמשתמש; type קובע סוג שדה, name/id מזהים אותו, ו־required/placeholder עשויים להגדיר חובה או רמז. המזהה הוא reset-code; הסוג הוא text; תווית נגישה הוא קוד איפוס סיסמה. --><input type="text" id="reset-code" placeholder="קוד אימות בן 6 ספרות" aria-label="קוד איפוס סיסמה" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
          </div>
          <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. מחלקות העיצוב הוא form-group. --><div class="form-group">
            <!-- השדה input אוסף ערך מהמשתמש; type קובע סוג שדה, name/id מזהים אותו, ו־required/placeholder עשויים להגדיר חובה או רמז. המזהה הוא new-password; הסוג הוא password; תווית נגישה הוא סיסמה חדשה. --><input type="password" id="new-password" placeholder="סיסמה חדשה" aria-label="סיסמה חדשה" minlength="8" maxlength="128" autocomplete="new-password">
          </div>
          <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. מחלקות העיצוב הוא form-group. --><div class="form-group">

          </div>
        </div>
        <!-- הכפתור button מפעיל פעולה או שולח טופס; type, id ו־class עשויים לקבוע את אופן הפעולה והעיצוב. המזהה הוא reset-submit; מחלקות העיצוב הוא btn-primary btn-submit; הסוג הוא submit. --><button type="submit" class="btn-primary btn-submit" id="reset-submit">שליחת קוד</button>
      </form>

      <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. מחלקות העיצוב הוא login-links. --><div class="login-links">
        <span>עדיין אין לך חשבון? <!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. המזהה הוא register-link; כתובת היעד הוא register.html. --><a href="register.html" id="register-link">הרשמה מהירה</a></span>

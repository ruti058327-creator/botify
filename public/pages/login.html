<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botify - התחברות</title>
  <link rel="icon" type="image/png" href="../images/pic.png">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <!-- סרגל ניווט עליון -->
  <header>
    <nav class="navbar">
      <a href="../index.html" class="logo" title="חזרה לדף הבית">
        <img src="../images/pic2.png" alt="Botify - בינה שמבינה" class="logo-img">
      </a>

      <ul class="nav-links">
        <li><a href="../index.html">בית</a></li>
        <li><a href="about.html">אודות</a></li>
        <li><a href="pricing.html">מחירון</a></li>
        <li><a href="demo.html">דמו</a></li>
        <li><a href="contact.html">צור קשר</a></li>
      </ul>

      <div class="auth-buttons">
        <a href="register.html" class="btn-primary">הרשמה</a>
      </div>
    </nav>
  </header>

  <!-- כרטיס התחברות -->
  <main class="login-wrapper">
    <div class="login-card">
      <h2>התחברות ל-Botify</h2>

      <div id="login-error" class="error-msg"></div>

      <form id="login-form">
        <div class="form-group">
          <input type="text" id="username" placeholder="שם משתמש / אימייל" required>
        </div>

        <div class="form-group">
          <input type="password" id="password" placeholder="סיסמה" required>
        </div>

        <button type="submit" class="btn-primary btn-submit" id="btn-login">התחבר</button>
      </form>

      <div class="login-links">
        <span>עדיין אין לך חשבון? <a href="register.html" id="register-link">הרשמה מהירה</a></span>
        <a href="../index.html" class="back-home-link">➔ חזרה לדף הבית</a>
      </div>
    </div>
  </main>

  <!-- פוטר -->
  <footer>
    <p>&copy; 2026 Botify. כל הזכויות שמורות.</p>
  </footer>

  <script src="../js/config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const redirectPage = urlParams.get('redirect');

      if (redirectPage) {
        document.getElementById('register-link').href = `register.html?redirect=${encodeURIComponent(redirectPage)}`;
      }

      const loginForm = document.getElementById('login-form');
      const errorDiv = document.getElementById('login-error');
      const submitBtn = document.getElementById('btn-login');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        submitBtn.disabled = true;
        submitBtn.textContent = 'מתחבר...';
        errorDiv.style.display = 'none';

        try {
          const response = await fetch((window.API_BASE_URL || '') + '/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await response.json();

          if (response.ok && data.token) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user || { username: username }));

            if (redirectPage) {
              window.location.href = redirectPage;
            } else {
              window.location.href = data.redirectUrl || '../index.html';
            }
          } else {
            errorDiv.textContent = data.message || 'שם משתמש או סיסמה שגויים';
            errorDiv.style.display = 'block';
          }
        } catch (err) {
          console.error('Login error:', err);
          errorDiv.textContent = 'שגיאת תקשורת מול השרת';
          errorDiv.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'התחבר';
        }
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botify - התחברות</title>
  <link rel="icon" type="image/png" href="../images/pic.png">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/login.css">
  <style>
    .login-wrapper {
      min-height: calc(100vh - 160px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      padding: 40px 35px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .login-card h2 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
      text-align: right;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(0, 4, 13, 0.12);
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 1.05rem;
      margin-top: 10px;
      margin-bottom: 20px;
    }
    .login-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.9rem;
      border-top: 1px solid #f1f5f9;
      padding-top: 18px;
    }
    .login-links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .back-home-link {
      color: #64748b !important;
      font-weight: 500 !important;
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.9rem;
      margin-bottom: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- סרגל ניווט עליון -->
  <header>
    <nav class="navbar">
      <a href="../index.html" class="logo" title="חזרה לדף הבית">
        <img src="../images/pic2.png" alt="Botify - בינה שמבינה" class="logo-img">
      </a>

      <ul class="nav-links">
        <li><a href="../index.html">בית</a></li>
        <li><a href="about.html">אודות</a></li>
        <li><a href="pricing.html">מחירון</a></li>
        <li><a href="demo.html">דמו</a></li>
        <li><a href="contact.html">צור קשר</a></li>
      </ul>

      <div class="auth-buttons">
        <a href="register.html" class="btn-primary">הרשמה</a>
      </div>
    </nav>
  </header>

  <!-- כרטיס התחברות -->
  <main class="login-wrapper">
    <div class="login-card">
      <h2>התחברות ל-Botify</h2>

      <div id="login-error" class="error-msg"></div>

      <form id="login-form">
        <div class="form-group" id="group-username">
          <input type="text" id="username" placeholder="שם משתמש / אימייל">
        </div>

        <div class="form-group" id="group-password">
          <input type="password" id="password" placeholder="סיסמה">
        </div>

        <!-- שדה קוד אימות שיופיע אוטומטית בשלב השני -->
        <div class="form-group" id="group-otp" style="display: none;">
          <input type="text" id="otpCode" placeholder="הכנס קוד אימות בן 6 ספרות" maxlength="6" style="text-align: center; font-size: 18px; letter-spacing: 4px;">
        </div>

        <button type="submit" class="btn-primary btn-submit" id="btn-login">התחבר</button>
      </form>

      <div class="login-links">
        <span>עדיין אין לך חשבון? <a href="register.html" id="register-link">הרשמה מהירה</a></span>
        <a href="../index.html" class="back-home-link">➔ חזרה לדף הבית</a>
      </div>
    </div>
  </main>

  <!-- פוטר -->
  <footer>
    <p>&copy; 2026 Botify. כל הזכויות שמורות.</p>
  </footer>

  <script src="../js/config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const redirectPage = urlParams.get('redirect');

      if (redirectPage) {
        document.getElementById('register-link').href = `register.html?redirect=${encodeURIComponent(redirectPage)}`;
      }

      const loginForm = document.getElementById('login-form');
      const errorDiv = document.getElementById('login-error');
      const submitBtn = document.getElementById('btn-login');

      let isOtpStep = false;
      let pendingEmail = '';

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorDiv.style.display = 'none';

        try {
          if (isOtpStep) {
            // ==========================================
            // שלב ב': שליחת קוד ה-OTP לאימות סופי
            // ==========================================
            const otpCode = document.getElementById('otpCode').value.trim();

            if (!otpCode) {
              errorDiv.textContent = 'נא להזין את קוד האימות';
              errorDiv.style.display = 'block';
              return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'מאמת קוד...';

            const response = await fetch((window.API_BASE_URL || '') + '/api/login-verify', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: pendingEmail, otpCode })
            });

            const data = await response.json();

            if (response.ok && data.success) {
              localStorage.setItem('user', JSON.stringify(data.user));
              if (data.token) {
                localStorage.setItem('token', data.token);
              }

              if (redirectPage) {
                window.location.href = redirectPage;
              } else {
                window.location.href = data.redirectUrl || 'dashboard.html';
              }
            } else {
              errorDiv.textContent = data.message || 'קוד האימות שגוי';
              errorDiv.style.display = 'block';
            }

          } else {
            // ==========================================
            // שלב א': שליחת שם משתמש וסיסמה
            // ==========================================
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
              errorDiv.textContent = 'נא למלא את כל השדות';
              errorDiv.style.display = 'block';
              return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'מתחבר...';

            const response = await fetch((window.API_BASE_URL || '') + '/api/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            // 1. משתמש לא קיים במערכת -> הפניה להרשמה
            if (response.status === 404) {
              alert('שם המשתמש אינו קיים במערכת. מועבר לדף ההרשמה.');
              window.location.href = 'register.html';
              return;
            }

            // 2. שגיאה כללית או סיסמה שגויה
            if (!response.ok) {
              errorDiv.textContent = data.message || 'פרטי התחברות שגויים';
              errorDiv.style.display = 'block';
              return;
            }

            // 3. במידה ומדובר במנהל הקשיח (NOAR) שנכנס מיד בלי OTP
            if (data.redirectUrl && !data.requireOtp) {
              localStorage.setItem('user', JSON.stringify(data.user));
              window.location.href = data.redirectUrl;
              return;
            }

            // 4. אם השרת דורש אימות OTP
            if (data.requireOtp) {
              pendingEmail = data.email;
              isOtpStep = true;

              // הסתרת שדות שם משתמש וסיסמה והצגת שדה הקוד
              document.getElementById('group-username').style.display = 'none';
              document.getElementById('group-password').style.display = 'none';
              document.getElementById('group-otp').style.display = 'block';

              errorDiv.style.color = '#16a34a'; // צבע ירוק להודעת הצלחה
              errorDiv.textContent = data.message || 'קוד אימות נשלח למייל שלך';
              errorDiv.style.display = 'block';

              submitBtn.textContent = 'אמת קוד והתחבר';
            }
          }
        } catch (err) {
          console.error('Login error:', err);
          errorDiv.style.color = '#ef4444';
          errorDiv.textContent = 'שגיאת תקשורת מול השרת';
          errorDiv.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
          if (!isOtpStep) {
            submitBtn.textContent = 'התחבר';
          }
        }
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botify - התחברות</title>
  <link rel="stylesheet" href="../css/global.css">
  
  <style>
    .login-wrapper {
      min-height: calc(100vh - 160px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      padding: 40px 35px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .login-card h2 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
      text-align: right;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(0, 4, 13, 0.12);
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 1.05rem;
      margin-top: 10px;
      margin-bottom: 20px;
    }
    .login-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.9rem;
      border-top: 1px solid #f1f5f9;
      padding-top: 18px;
    }
    .login-links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .back-home-link {
      color: #64748b !important;
      font-weight: 500 !important;
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.9rem;
      margin-bottom: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="../index.html" class="logo" title="חזרה לדף הבית">
        <img src="../images/pic2.png" alt="Botify - בינה שמבינה" class="logo-img">
      </a>
      <ul class="nav-links">
        <li><a href="../index.html">בית</a></li>
        <li><a href="about.html">אודות</a></li>
        <li><a href="pricing.html">מחירון</a></li>
        <li><a href="demo.html">דמו</a></li>
        <li><a href="contact.html">צור קשר</a></li>
      </ul>
      <div class="auth-buttons">
        <a href="register.html" class="btn-primary">הרשמה</a>
      </div>
    </nav>
  </header>

  <main class="login-wrapper">
    <div class="login-card">
      <h2>התחברות ל-Botify</h2>

      <div id="login-error" class="error-msg"></div>

      <form id="login-form">
        <div class="form-group">
          <input type="text" id="username" placeholder="שם משתמש / אימייל" required>
        </div>

        <div class="form-group">
          <input type="password" id="password" placeholder="סיסמה" required>
        </div>

        <button type="submit" class="btn-primary btn-submit" id="btn-login">התחבר</button>
      </form>

      <div class="login-links">
        <span>עדיין אין לך חשבון? <a href="register.html" id="register-link">הרשמה מהירה</a></span>
        <a href="../index.html" class="back-home-link">➔ חזרה לדף הבית</a>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Botify. כל הזכויות שמורות.</p>
  </footer>

  <script src="../js/config.js"></script>

</html>

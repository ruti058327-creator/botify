                    <!-- האלמנט label נותן שם ברור לשדה; התאמה באמצעות for ל־id של השדה משפרת שימושיות ונגישות. הקישור לשדה הוא otpCode. --><label for="otpCode">הזן קוד אימות (6 ספרות):</label>
                    <!-- השדה input אוסף ערך מהמשתמש; type קובע סוג שדה, name/id מזהים אותו, ו־required/placeholder עשויים להגדיר חובה או רמז. המזהה הוא otpCode; הסוג הוא text. --><input type="text" id="otpCode" placeholder="------" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required style="text-align: center; letter-spacing: 6px; font-size: 1.3rem; font-weight: bold;">
                </div>

                <!-- הכפתור button מפעיל פעולה או שולח טופס; type, id ו־class עשויים לקבוע את אופן הפעולה והעיצוב. המזהה הוא verifyBtn; מחלקות העיצוב הוא btn-primary btn-submit; הסוג הוא submit. --><button type="submit" id="verifyBtn" class="btn-primary btn-submit">אמת קוד והשלם הרשמה</button>
                </form>

                <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 8px; text-align: center;">
                    <!-- הכפתור button מפעיל פעולה או שולח טופס; type, id ו־class עשויים לקבוע את אופן הפעולה והעיצוב. המזהה הוא resendBtn; מחלקות העיצוב הוא btn-secondary-link; הסוג הוא button. --><button type="button" id="resendBtn" onclick="handleResendCode()" class="btn-secondary-link" style="background: none; border: none; color: #2563eb; cursor: pointer; font-weight: 600;">🔄 שלח לי קוד חדש למייל</button>
                    <!-- הכפתור button מפעיל פעולה או שולח טופס; type, id ו־class עשויים לקבוע את אופן הפעולה והעיצוב. מחלקות העיצוב הוא btn-secondary-link; הסוג הוא button. --><button type="button" onclick="handleBackToEdit()" class="btn-secondary-link" style="background: none; border: none; color: #64748b; cursor: pointer;">✏️ חזרה לעריכת הפרטים</button>
                </div>
            </div>

        </div>
    </main>

    <!-- אזור footer מציג מידע מסכם, קישורים או פרטי זכויות יוצרים בתחתית הדף/החלק. --><footer>
        <!-- האלמנט p מציג פסקה של טקסט רגיל. --><p>&copy; 2026 Botify. כל הזכויות שמורות.</p>
    </footer>

    <!-- הקובץ ../js/register.js מחבר JavaScript לדף; הקוד שבו מוסיף את התנהגות הדף. הסוג הוא module; מקור הקובץ הוא ../js/register.js. --><script type="module" src="../js/register.js"></script>
    <!-- הקובץ ../js/navbar-auth.js מחבר JavaScript לדף; הקוד שבו מוסיף את התנהגות הדף. הסוג הוא module; מקור הקובץ הוא ../js/navbar-auth.js. --><script type="module" src="../js/navbar-auth.js"></script>

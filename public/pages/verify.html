<!DOCTYPE html>
<html lang="he" dir="rtl"><!-- אלמנט השורש מכיל את כל מסמך ה־HTML; lang מציין את שפת התוכן ו־dir קובע את כיווניות הכתיבה. -->
<!-- האזור head מכיל הגדרות מסמך, כותרת וקישורים לקובצי עיצוב או סקריפטים; הוא אינו מוצג כתוכן הדף. --><head><!-- דף האימות מנחה את המשתמש לאמת את זהותו או את פרטי החשבון שהוזנו. -->
    <!-- תג meta מספק הגדרות מסמך לדפדפן; charset מגדיר קידוד תווים ו־viewport תומך בפריסה מותאמת למסכים שונים. --><meta charset="UTF-8">
    <!-- תג meta מספק הגדרות מסמך לדפדפן; charset מגדיר קידוד תווים ו־viewport תומך בפריסה מותאמת למסכים שונים. שם השדה הוא viewport. --><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- הכותרת title מופיעה בלשונית הדפדפן ומשמשת גם לזיהוי הדף בתוצאות חיפוש. --><title>Botify - אימות קוד הרשמה</title>
    <!-- תוקן לנתיבים יחסיים (../) במקום מוחלטים (/) -->
    <!-- הקישור למשאב ../images/pic.png מחבר עיצוב, סמל אתר או משאב מסמך לפי rel. הסוג הוא image/png; כתובת היעד הוא ../images/pic.png. --><link rel="icon" type="image/png" href="../images/pic.png">
    <!-- הקישור למשאב ../css/global.css מחבר עיצוב, סמל אתר או משאב מסמך לפי rel. כתובת היעד הוא ../css/global.css. --><link rel="stylesheet" href="../css/global.css">
    <!-- הקישור למשאב ../css/register.css מחבר עיצוב, סמל אתר או משאב מסמך לפי rel. כתובת היעד הוא ../css/register.css. --><link rel="stylesheet" href="../css/register.css">
    <!-- הקובץ ../js/session-manager.js מחבר JavaScript לדף; הקוד שבו מוסיף את התנהגות הדף. מקור הקובץ הוא ../js/session-manager.js. --><script src="../js/session-manager.js"></script>
</head>
<!-- האזור body מכיל את התוכן והפקדים שמוצגים למשתמש בדף. --><body>

    <!-- אזור header מציג תוכן פתיחה או כותרת של הדף/החלק. --><header>
        <!-- אזור nav מרכז קישורי ניווט בין דפים או אזורים באתר. מחלקות העיצוב הוא navbar. --><nav class="navbar">
            <!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. מחלקות העיצוב הוא logo; כתובת היעד הוא ../index.html. --><a href="../index.html" class="logo" title="חזרה לדף הבית">
                <!-- תוקן לשם הלוגו התקין שמופיע בכל שאר האתר -->
                <!-- התמונה img מציגה קובץ שמוגדר ב־src; alt מספק תיאור חלופי לקוראי מסך או כשהתמונה אינה נטענת. מחלקות העיצוב הוא logo-img; מקור הקובץ הוא ../images/pic2.png. --><img src="../images/pic2.png" alt="Botify - בינה שמבינה" class="logo-img">
            </a>
            <!-- הרשימה ul מציגה פריטים ללא סדר מחייב. מחלקות העיצוב הוא nav-links. --><ul class="nav-links">
                <!-- הפריט li הוא פריט יחיד בתוך רשימה. --><li><!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. כתובת היעד הוא ../index.html. --><a href="../index.html">בית</a></li>
                <!-- הפריט li הוא פריט יחיד בתוך רשימה. --><li><!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. כתובת היעד הוא about.html. --><a href="about.html">אודות</a></li>
                <!-- הפריט li הוא פריט יחיד בתוך רשימה. --><li><!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. כתובת היעד הוא pricing.html. --><a href="pricing.html">מחירון</a></li>
                <!-- הפריט li הוא פריט יחיד בתוך רשימה. --><li><!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. כתובת היעד הוא contact.html. --><a href="contact.html">צור קשר</a></li>
            </ul>
        </nav>
    </header>

    <!-- אזור main מכיל את התוכן המרכזי והייחודי של הדף. מחלקות העיצוב הוא login-wrapper. --><main class="login-wrapper">
        <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. מחלקות העיצוב הוא login-card. --><div class="login-card">
            <!-- כותרת h2 מציגה נושא מרכזי בתוך הדף ומסייעת לבנות היררכיית תוכן. --><h2>אימות כתובת מייל</h2>
            
            <!-- האלמנט p מציג פסקה של טקסט רגיל. מחלקות העיצוב הוא otp-instruction. --><p class="otp-instruction">
                שלחנו קוד אימות בן 6 ספרות לכתובת:<br>
                <strong id="sentEmailDisplay" style="color: #2563eb; font-size: 1.05rem;">טוען...</strong>
            </p>

            <!-- ספירה לאחור חיה ל-5 דקות -->
            <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. המזהה הוא timerDisplay. --><div id="timerDisplay" style="color: #dc2626; font-weight: bold; margin-bottom: 15px; font-size: 0.95rem;">
                זמן שנותר להזנת הקוד: 05:00
            </div>

            <!-- אזור הודעות שגיאה / הצלחה -->
            <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. המזהה הוא message; מחלקות העיצוב הוא error-msg. --><div id="message" class="error-msg" style="display: none;"></div>

            <!-- טופס אימות קוד -->
            <!-- הטופס form מאגד שדות ופקדי שליחה. action ו־method, אם קיימים, מגדירים יעד ואופן שליחה; לעיתים JavaScript מטפל בשליחה. המזהה הוא verifyForm. --><form id="verifyForm">
                <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. מחלקות העיצוב הוא form-group. --><div class="form-group">
                    <!-- האלמנט label נותן שם ברור לשדה; התאמה באמצעות for ל־id של השדה משפרת שימושיות ונגישות. הקישור לשדה הוא otpCode. --><label for="otpCode">הזן קוד אימות (6 ספרות):</label>
                    <!-- השדה input אוסף ערך מהמשתמש; type קובע סוג שדה, name/id מזהים אותו, ו־required/placeholder עשויים להגדיר חובה או רמז. המזהה הוא otpCode; מחלקות העיצוב הוא otp-input; הסוג הוא text. --><input type="text" id="otpCode" class="otp-input" placeholder="------" maxlength="6" required autocomplete="one-time-code" autofocus>
                </div>

                <!-- הכפתור button מפעיל פעולה או שולח טופס; type, id ו־class עשויים לקבוע את אופן הפעולה והעיצוב. המזהה הוא verifyBtn; מחלקות העיצוב הוא btn-primary btn-submit; הסוג הוא submit. --><button type="submit" id="verifyBtn" class="btn-primary btn-submit">אמת קוד והשלם הרשמה</button>
            </form>

            <!-- פעולות במקרה של תקלה או תפוגה -->
            <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. המזהה הוא actionButtons. --><div id="actionButtons" style="margin-top: 15px; display: flex; flex-direction: column; gap: 8px;">
                <!-- הכפתור button מפעיל פעולה או שולח טופס; type, id ו־class עשויים לקבוע את אופן הפעולה והעיצוב. המזהה הוא resendCodeBtn; מחלקות העיצוב הוא btn-secondary-link; הסוג הוא button. --><button type="button" id="resendCodeBtn" class="btn-secondary-link">🔄 שלח לי קוד חדש למייל</button>
                <!-- הכפתור button מפעיל פעולה או שולח טופס; type, id ו־class עשויים לקבוע את אופן הפעולה והעיצוב. המזהה הוא editDetailsBtn; מחלקות העיצוב הוא btn-secondary-link; הסוג הוא button. --><button type="button" id="editDetailsBtn" class="btn-secondary-link">✏️ חזרה לתיקון או עריכת הפרטים</button>
            </div>
        </div>
    </main>

    <!-- תוקן לנתיב יחסי -->
    <!-- הקובץ ../js/verify.js מחבר JavaScript לדף; הקוד שבו מוסיף את התנהגות הדף. הסוג הוא module; מקור הקובץ הוא ../js/verify.js. --><script type="module" src="../js/verify.js"></script>
    <!-- הקובץ ../js/navbar-auth.js מחבר JavaScript לדף; הקוד שבו מוסיף את התנהגות הדף. הסוג הוא module; מקור הקובץ הוא ../js/navbar-auth.js. --><script type="module" src="../js/navbar-auth.js"></script>
</body>
</html>

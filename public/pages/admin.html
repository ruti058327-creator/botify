<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botify - פאנל ניהול</title>
    <link rel="icon" type="image/png" href="../images/pic.png">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="../js/session-manager.js"></script>
</head>
<body>

    <div class="sidebar">
        <div>
            <h2>Botify Admin</h2>
            <span class="badge">פרופיל ניהול פעיל</span>
            <p class="admin-info">מנהל מחובר: <strong id="adminNameDisplay">טוען...</strong></p>
        </div>
        <div>
            <a href="login.html" class="logout-link">התנתקות</a>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>לוח בקרה וניהול מערכת</h1>
        </div>

        <!-- כרטיסיית ספירת מנויים -->
        <div class="stats-cards">
            <div class="stat-card">
                <h3>סה"כ מנויים רשומים</h3>
                <div class="number" id="subscriberCount">0</div>
            </div>
        </div>

        <!-- תיבת הודעות נכנסות (צור קשר) -->
        <h2 class="section-title">הודעות נכנסות (צור קשר)</h2>
        <div class="messages-container" id="messagesList">
            <p class="status-msg">טוען הודעות...</p>
        </div>

        <!-- טבלת משתמשים -->
        <h2 class="section-title">רשימת משתמשים</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>שם משתמש</th>
                    <th>אימייל</th>
                    <th>סוג מנוי</th>
                    <th>תאריך הרשמה</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <tr><td colspan="5" class="status-msg">טוען נתונים...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- טעינת קובץ הלוגיקה החיצוני -->
    <script src="../js/admin.js"></script>
</body>
</html>

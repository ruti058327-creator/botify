<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botify - פאנל ניהול</title>
    <link rel="icon" type="image/png" href="../images/pic.png">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="../js/session-manager.js"></script>
</head>
<body>

    <div class="sidebar">
        <div>
            <h2>Botify Admin</h2>
            <span class="badge">פרופיל ניהול פעיל</span>
            <p class="admin-info">מנהל מחובר: <strong id="adminNameDisplay">טוען...</strong></p>
        </div>
        <div>
            <a href="login.html" class="logout-link">התנתקות</a>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>לוח בקרה וניהול מערכת</h1>
        </div>

        <!-- כרטיסיית ספירת מנויים -->
        <div class="stats-cards">
            <div class="stat-card">
                <h3>סה"כ מנויים רשומים</h3>
                <div class="number" id="subscriberCount">0</div>
            </div>
        </div>

        <!-- תיבת הודעות נכנסות (צור קשר) עם שורת חיפוש -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
            <h2 class="section-title" style="margin: 0;">הודעות נכנסות (צור קשר)</h2>
            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                <input type="text" id="adminSearchClient" placeholder="🔍 חפש שם לקוח..." oninput="filterAdminChats()" style="padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; width: 250px; font-size: 14px;">
                <button onclick="showAllClientChats()" style="padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; color: #334155; cursor: pointer;">הצג הכל</button>
            </div>
        </div>

        <div class="messages-container" id="messagesList">
            <p class="status-msg">טוען הודעות...</p>
        </div>

        <!-- טבלת לקוחות -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 30px 0 15px; flex-wrap: wrap; gap: 10px;">
            <h2 class="section-title" style="margin: 0;">רשימת לקוחות</h2>
            <input type="text" id="adminSearchUsers" placeholder="🔍 חפש לקוח לפי שם או אימייל..." oninput="filterAdminUsers()" style="padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; width: 280px; font-size: 14px;">
        </div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>שם משתמש</th>
                    <th>אימייל</th>
                    <th>סוג מנוי</th>
                    <th>תאריך הרשמה</th>
                    <th>היסטוריית שיחות</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <tr><td colspan="6" class="status-msg">טוען נתונים...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="../js/admin.js"></script>
    <script src="../js/navbar-auth.js"></script>
</body>
</html>

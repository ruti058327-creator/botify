<!DOCTYPE html>
<html lang="he" dir="rtl"><!-- אלמנט השורש מכיל את כל מסמך ה־HTML; lang מציין את שפת התוכן ו־dir קובע את כיווניות הכתיבה. -->
<!-- האזור head מכיל הגדרות מסמך, כותרת וקישורים לקובצי עיצוב או סקריפטים; הוא אינו מוצג כתוכן הדף. --><head><!-- טופס יצירת הבוט אוסף את פרטי העסק והגדרות הבוט לצורך יצירתו. -->
    <!-- תג meta מספק הגדרות מסמך לדפדפן; charset מגדיר קידוד תווים ו־viewport תומך בפריסה מותאמת למסכים שונים. --><meta charset="UTF-8">
    <!-- תג meta מספק הגדרות מסמך לדפדפן; charset מגדיר קידוד תווים ו־viewport תומך בפריסה מותאמת למסכים שונים. שם השדה הוא viewport. --><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- הכותרת title מופיעה בלשונית הדפדפן ומשמשת גם לזיהוי הדף בתוצאות חיפוש. --><title>Botify - יצירת בוט חדש</title>
    <!-- הקישור למשאב ../images/pic.png מחבר עיצוב, סמל אתר או משאב מסמך לפי rel. הסוג הוא image/png; כתובת היעד הוא ../images/pic.png. --><link rel="icon" type="image/png" href="../images/pic.png">
    <!-- הקישור למשאב ../css/global.css מחבר עיצוב, סמל אתר או משאב מסמך לפי rel. כתובת היעד הוא ../css/global.css. --><link rel="stylesheet" href="../css/global.css">
    <!-- הקובץ ../js/session-manager.js מחבר JavaScript לדף; הקוד שבו מוסיף את התנהגות הדף. מקור הקובץ הוא ../js/session-manager.js. --><script src="../js/session-manager.js"></script>
    <!-- תג style מכיל כללי CSS לעיצוב הדף; הוא נפרד מתוכן ה־HTML ואין להוסיף בו הערות HTML. --><style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            min-height: 100vh;
        }
        .create-bot-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .dashboard-link {
            display: block;
            width: fit-content;
            margin: 0 auto 20px;
            color: #0056b3;
            font-weight: bold;
            text-decoration: none;
        }
        .dashboard-link:hover {
            text-decoration: underline;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .quota-checking .container {
            visibility: hidden;
        }
        input[type="url"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<!-- האזור body מכיל את התוכן והפקדים שמוצגים למשתמש בדף. מחלקות העיצוב הוא quota-checking. --><body class="quota-checking">

    <!-- אזור header מציג תוכן פתיחה או כותרת של הדף/החלק. --><header>
        <!-- אזור nav מרכז קישורי ניווט בין דפים או אזורים באתר. מחלקות העיצוב הוא navbar. --><nav class="navbar">
            <!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. מחלקות העיצוב הוא logo; כתובת היעד הוא ../index.html. --><a href="../index.html" class="logo" title="Botify - חזרה לדף הבית">
                <!-- התמונה img מציגה קובץ שמוגדר ב־src; alt מספק תיאור חלופי לקוראי מסך או כשהתמונה אינה נטענת. מחלקות העיצוב הוא logo-img; מקור הקובץ הוא ../images/pic2.png. --><img src="../images/pic2.png" alt="Botify - בינה שמבינה" class="logo-img">
            </a>
            <!-- הרשימה ul מציגה פריטים ללא סדר מחייב. מחלקות העיצוב הוא nav-links. --><ul class="nav-links">
                <!-- הפריט li הוא פריט יחיד בתוך רשימה. --><li><!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. כתובת היעד הוא ../index.html. --><a href="../index.html">בית</a></li>
                <!-- הפריט li הוא פריט יחיד בתוך רשימה. --><li><!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. כתובת היעד הוא about.html. --><a href="about.html">אודות</a></li>
                <!-- הפריט li הוא פריט יחיד בתוך רשימה. --><li><!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. כתובת היעד הוא pricing.html. --><a href="pricing.html">מחירון</a></li>
                <!-- הפריט li הוא פריט יחיד בתוך רשימה. --><li><!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. כתובת היעד הוא contact.html. --><a href="contact.html">צור קשר</a></li>
            </ul>
            <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. המזהה הוא nav-auth-container; מחלקות העיצוב הוא auth-buttons. --><div class="auth-buttons" id="nav-auth-container"></div>
        </nav>
    </header>

    <!-- אזור main מכיל את התוכן המרכזי והייחודי של הדף. מחלקות העיצוב הוא create-bot-main. --><main class="create-bot-main">
    <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. מחלקות העיצוב הוא container. --><div class="container">
        <!-- כותרת h2 מציגה נושא מרכזי בתוך הדף ומסייעת לבנות היררכיית תוכן. המזהה הוא form-title. --><h2 id="form-title">מחולל הבוטים של Botify</h2>
        <!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. מחלקות העיצוב הוא dashboard-link; כתובת היעד הוא dashboard.html. --><a class="dashboard-link" href="dashboard.html">חזרה לאזור האישי</a>
        <!-- הטופס form מאגד שדות ופקדי שליחה. action ו־method, אם קיימים, מגדירים יעד ואופן שליחה; לעיתים JavaScript מטפל בשליחה. המזהה הוא createBotForm. --><form id="createBotForm">
            <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. מחלקות העיצוב הוא form-group. --><div class="form-group">
                <!-- האלמנט label נותן שם ברור לשדה; התאמה באמצעות for ל־id של השדה משפרת שימושיות ונגישות. הקישור לשדה הוא websiteUrl. --><label for="websiteUrl">כתובת האתר שלך (URL):</label>
                <!-- השדה input אוסף ערך מהמשתמש; type קובע סוג שדה, name/id מזהים אותו, ו־required/placeholder עשויים להגדיר חובה או רמז. המזהה הוא websiteUrl; שם השדה הוא websiteUrl; הסוג הוא text. --><input type="text" id="websiteUrl" name="websiteUrl" placeholder="example.com או https://example.com" inputmode="url" required>
            </div>
            
            <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. מחלקות העיצוב הוא form-group. --><div class="form-group">
                <!-- האלמנט label נותן שם ברור לשדה; התאמה באמצעות for ל־id של השדה משפרת שימושיות ונגישות. הקישור לשדה הוא instructions. --><label for="instructions">הנחיות לבוט (מה תרצה שהבוט יעשה?):</label>
                <!-- השדה textarea מאפשר להזין טקסט רב־שורות; name/id מזהים אותו ו־placeholder עשוי להציג רמז. המזהה הוא instructions; שם השדה הוא instructions. --><textarea id="instructions" name="instructions" placeholder="לדוגמה: ענה על שאלות לקוחות מתוך אתר החברה בלבד..."></textarea>
            </div>

            <!-- הכפתור button מפעיל פעולה או שולח טופס; type, id ו־class עשויים לקבוע את אופן הפעולה והעיצוב. המזהה הוא submit-bot-btn; הסוג הוא submit. --><button type="submit" id="submit-bot-btn">צור בוט אישי</button>
        </form>
        <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. המזהה הוא result. --><div id="result"></div>
    </div>
    </main>

    <!-- אזור footer מציג מידע מסכם, קישורים או פרטי זכויות יוצרים בתחתית הדף/החלק. מחלקות העיצוב הוא site-footer. --><footer class="site-footer">
        <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. מחלקות העיצוב הוא footer-container. --><div class="footer-container">
            <!-- הרשימה ul מציגה פריטים ללא סדר מחייב. מחלקות העיצוב הוא footer-links. --><ul class="footer-links">
                <!-- הפריט li הוא פריט יחיד בתוך רשימה. --><li><!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. כתובת היעד הוא terms.html. --><a href="terms.html">תנאי שימוש</a></li>
                <!-- הפריט li הוא פריט יחיד בתוך רשימה. --><li><!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. כתובת היעד הוא privacy.html. --><a href="privacy.html">מדיניות פרטיות</a></li>
                <!-- הפריט li הוא פריט יחיד בתוך רשימה. --><li><!-- הקישור a מוביל לכתובת שב־href או מפעיל ניווט; הטקסט שבתוכו מתאר למשתמש את יעד הקישור. כתובת היעד הוא accessibility.html. --><a href="accessibility.html">הצהרת נגישות</a></li>
            </ul>
        </div>
        <!-- האלמנט div הוא מכל כללי לארגון תוכן; class משמש בדרך כלל לעיצוב משותף ו־id מזהה רכיב יחיד עבור CSS או JavaScript. מחלקות העיצוב הוא footer-bottom. --><div class="footer-bottom">
            <!-- האלמנט p מציג פסקה של טקסט רגיל. --><p>&copy; 2026 Botify. כל הזכויות שמורות.</p>
        </div>
    </footer>

    <!-- תג script מחבר או מכיל JavaScript שמוסיף התנהגות לדף; src מצביע על קובץ, ו־defer/async משפיעים על מועד הטעינה. הסוג הוא module. --><script type="module">
        import { ApiService } from '../services/api-service.js';

        const createBotForm = document.getElementById('createBotForm');
        const resultDiv = document.getElementById('result');
        const formTitle = document.getElementById('form-title');
        const submitBotBtn = document.getElementById('submit-bot-btn');
        const websiteUrlInput = document.getElementById('websiteUrl');
        const instructionsInput = document.getElementById('instructions');
        const editBotId = new URLSearchParams(window.location.search).get('id');
        const pendingDraft = sessionStorage.getItem('botify_pending_bot_draft');
        if (!editBotId && pendingDraft) {
            try {
                const draft = JSON.parse(pendingDraft);
                document.getElementById('websiteUrl').value = draft.websiteUrl || '';
                document.getElementById('instructions').value = draft.instructions || '';
            } catch {
                sessionStorage.removeItem('botify_pending_bot_draft');
            }
        }

        async function initializeForm() {
            const token = localStorage.getItem('token');
            if (editBotId) {
                formTitle.textContent = 'עריכת הגדרות והנחיות הבוט';
                submitBotBtn.textContent = 'שמור שינויים בבוט';
                if (!token) {
                    resultDiv.textContent = 'יש להתחבר כדי לערוך בוט.';
                    document.body.classList.remove('quota-checking');
                    return;
                }

                try {
                    const response = await ApiService.request(`/api/bots/${encodeURIComponent(editBotId)}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.message || 'לא ניתן לטעון את פרטי הבוט');
                    websiteUrlInput.value = data.bot.websiteUrl;
                    websiteUrlInput.readOnly = true;
                    instructionsInput.value = data.bot.instructions || '';
                } catch (error) {
                    resultDiv.textContent = error.message;
                    resultDiv.style.color = 'red';
                } finally {
                    document.body.classList.remove('quota-checking');
                }
                return;
            }
            checkBotQuota();
        }

        /**
         * בודק את מכסת הבוטים לפני הצגת טופס יצירה למשתמש מחובר.
         * @returns {Promise<void>} מפנה לתמחור או מציג שגיאת בדיקת מכסה.
         */
        async function checkBotQuota() {
            const token = localStorage.getItem('token');
            if (!token) {
                document.body.classList.remove('quota-checking');
                return;
            }

            try {
                const response = await ApiService.request('/api/bots/quota', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (response.status === 401) {
                    localStorage.removeItem('token');
                    resultDiv.style.color = 'red';
                    resultDiv.innerHTML = 'יש להתחבר מחדש כדי ליצור בוט. <a href="login.html">מעבר להתחברות</a>.';
                } else if (!response.ok) {
                    throw new Error(data.message || 'לא ניתן לבדוק את מכסת הבוטים');
                } else if (data.requiresPayment) {
                    window.location.replace(data.pricingUrl);
                    return;
                }
            } catch (error) {
                resultDiv.style.color = 'red';
                resultDiv.textContent = error.message || 'לא ניתן לבדוק את מכסת הבוטים';
            }

            document.body.classList.remove('quota-checking');
        }

        initializeForm();

        /**
         * שולח את כתובת האתר וההנחיות ליצירת בוט חדש.
         * @param {SubmitEvent} e אירוע שליחת טופס יצירת הבוט.
         * @returns {Promise<void>} מציג תוצאת סריקה או שגיאת יצירה.
         */
        createBotForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const websiteUrl = document.getElementById('websiteUrl').value;
            const instructions = document.getElementById('instructions').value;
            const token = localStorage.getItem('token');

            if (!token) {
                resultDiv.style.color = 'red';
                resultDiv.innerHTML = 'כדי ליצור ולשמור בוט, יש <a href="login.html">להתחבר</a> תחילה.';
                return;
            }

            if (editBotId) {
                resultDiv.style.color = '#333';
                resultDiv.textContent = 'שומר עדכונים...';
                submitBotBtn.disabled = true;
                try {
                    const response = await ApiService.request(`/api/bots/${encodeURIComponent(editBotId)}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ instructions: instructionsInput.value })
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.message || 'שגיאה בעדכון הבוט');
                    resultDiv.style.color = 'green';
                    resultDiv.textContent = 'הבוט עודכן בהצלחה! מעביר לאזור האישי...';
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
                } catch (error) {
                    resultDiv.style.color = 'red';
                    resultDiv.textContent = error.message;
                    submitBotBtn.disabled = false;
                }
                return;
            }
            
            resultDiv.style.color = '#333';
            resultDiv.textContent = 'יוצר בוט וסורק את האתר, נא להמתין...';

            try {
                const response = await ApiService.request('/api/bots/create-bot', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ websiteUrl, instructions })
                });

                const data = await response.json();

                if (response.status === 403 && data.code === 'BOT_LIMIT_REACHED') {
                    sessionStorage.setItem('botify_pending_bot_draft', JSON.stringify({ websiteUrl, instructions }));
                    window.location.href = data.pricingUrl;
                    return;
                }

                if (data.success) {
                    sessionStorage.removeItem('botify_pending_bot_draft');
                    resultDiv.style.color = 'green';
                    resultDiv.innerHTML = `הבוט נוצר בהצלחה! <br><a href="${data.botUrl}" target="_blank">מעבר לבוט האישי שלך</a>`;
                } else {
                    resultDiv.style.color = 'red';
                    resultDiv.textContent = data.message || 'שגיאה ביצירת הבוט';
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.style.color = 'red';
                resultDiv.textContent = 'שגיאת תקשורת מול השרת';
            }
        });
    </script>
    <!-- הקובץ ../js/navbar-auth.js מחבר JavaScript לדף; הקוד שבו מוסיף את התנהגות הדף. הסוג הוא module; מקור הקובץ הוא ../js/navbar-auth.js. --><script type="module" src="../js/navbar-auth.js"></script>
</body>
</html>

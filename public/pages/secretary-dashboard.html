<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ניהול בוט מזכירה - Botify</title>
  <link rel="stylesheet" href="../css/secretary-dashboard.css">
</head>
<body>

  <div class="container">
    <h2>הגדרות בוט המזכירה</h2>
    <form id="secretaryForm">
      <div class="form-group">
        <label for="botUrlKey">מזהה קישור ייחודי לבוט (באנגלית בלבד, למשל: my-salon):</label>
        <input type="text" id="botUrlKey" required placeholder="לדוגמה: my-salon">
      </div>
      
      <div class="form-group">
        <label for="dayOff">יום חופש קבוע בשבוע (מעבר לשבת):</label>
        <select id="dayOff" required>
          <option value="ראשון">ראשון</option>
          <option value="שני">שני</option>
          <option value="שלישי">שלישי</option>
          <option value="רביעי">רביעי</option>
          <option value="חמישי">חמישי</option>
          <option value="שישי">שישי</option>
        </select>
      </div>

      <div class="form-group">
        <label for="openTime">שעת פתיחה:</label>
        <input type="time" id="openTime" value="09:00" required>
      </div>

      <div class="form-group">
        <label for="closeTime">שעת סגירה:</label>
        <input type="time" id="closeTime" value="18:00" required>
      </div>

      <div class="form-group">
        <label for="appointmentDurationMinutes">משך זמן פגישה (בדקות):</label>
        <input type="number" id="appointmentDurationMinutes" value="30" step="5" min="5" required>
      </div>

      <div class="form-group">
        <label for="defaultPrice">מחיר ברירת מחדל לפגישה (₪):</label>
        <input type="number" id="defaultPrice" value="150" required>
      </div>

      <button type="submit">שמור הגדרות</button>
    </form>
    <div id="message"></div>
  </div>

  <script src="../js/secretary-dashboard.js"></script>
</body>
</html>

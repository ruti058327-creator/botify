<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול בוט מזכירה - Botify</title>
  <link rel="icon" type="image/png" href="../images/pic.png">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/secretary-dashboard.css">
  <script src="../js/session-manager.js"></script>
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="../index.html" class="logo" title="Botify - חזרה לדף הבית">
        <img src="../images/pic2.png" alt="Botify - בינה שמבינה" class="logo-img">
      </a>
      <ul class="nav-links">
        <li><a href="../index.html">בית</a></li>
        <li><a href="about.html">אודות</a></li>
        <li><a href="pricing.html">מחירון</a></li>
        <li><a href="contact.html">צור קשר</a></li>
      </ul>
      <div class="auth-buttons" id="nav-auth-container"></div>
    </nav>
  </header>

  <div class="container">
    <h2>הגדרות בוט המזכירה</h2>
    <a href="secretary-bots.html">חזרה לניהול הבוטים</a>
    <form id="secretaryForm">
      <div class="form-group">
        <label for="botUrlKey">מזהה קישור ייחודי לבוט (באנגלית בלבד, למשל: my-salon):</label>
        <input type="text" id="botUrlKey" required placeholder="לדוגמה: my-salon">
      </div>
      
      <div class="form-group">
        <label for="dayOff">יום חופש קבוע בשבוע (מעבר לשבת):</label>
        <select id="dayOff" required>
          <option value="ראשון">ראשון</option>
          <option value="שני">שני</option>
          <option value="שלישי">שלישי</option>
          <option value="רביעי">רביעי</option>
          <option value="חמישי">חמישי</option>
          <option value="שישי">שישי</option>
        </select>
      </div>

      <div class="form-group">
        <label for="openTime">שעת פתיחה:</label>
        <input type="time" id="openTime" value="09:00" required>
      </div>

      <div class="form-group">
        <label for="closeTime">שעת סגירה:</label>
        <input type="time" id="closeTime" value="18:00" required>
      </div>

      <div class="form-group">
        <label for="appointmentDurationMinutes">משך זמן פגישה (בדקות):</label>
        <input type="number" id="appointmentDurationMinutes" value="30" step="5" min="5" required>
      </div>

      <div class="form-group">
        <label for="breakDurationMinutes">הפסקה בין פגישות (בדקות):</label>
        <input type="number" id="breakDurationMinutes" value="10" step="5" min="0" required>
      </div>

      <div class="form-group">
        <label for="defaultPrice">מחיר ברירת מחדל לפגישה (₪):</label>
        <input type="number" id="defaultPrice" value="150" required>
      </div>

      <button type="submit">שמור הגדרות</button>
    </form>
    <div id="message"></div>
  </div>

  <footer class="site-footer">
    <div class="footer-container">
      <ul class="footer-links">
        <li><a href="terms.html">תנאי שימוש</a></li>
        <li><a href="privacy.html">מדיניות פרטיות</a></li>
        <li><a href="accessibility.html">הצהרת נגישות</a></li>
      </ul>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 Botify. כל הזכויות שמורות.</p>
    </div>
  </footer>

  <script src="../js/secretary-dashboard.js"></script>
  <script type="module" src="../js/navbar-auth.js"></script>
</body>
</html>
